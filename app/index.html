<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1e2a8e" />
<title>FINA go</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<!-- Deploy: isi URL API publik di sini (mis. https://finago-api.onrender.com). Kosong = localhost:8787 (dev). -->
<script>window.FG_API = "https://finago-api.arifkusharyadi02.workers.dev";</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Satoshi','ui-sans-serif','system-ui'], serif: ['Newsreader','Georgia','serif'], mono: ['JetBrains Mono','ui-monospace'] },
      colors: {
        ink: '#15183a',
        brand: { 50:'#eef0fb',100:'#d6dcf7',200:'#bcc3f3',300:'#8e9ae8',400:'#5d6dda',500:'#1e2a8e',600:'#1a247a',700:'#141a4f',900:'#0d1130' },
        accent: { 400:'#2dd4bf',500:'#14b8a6',600:'#0d9488',700:'#0f766e' },
        paper: '#f5f6f9', line: '#e6e8f0',
      },
      borderRadius: { card:'14px', fld:'10px', chip:'8px' },
      boxShadow: { soft:'0 1px 2px rgba(21,24,58,.05)', card:'0 1px 2px rgba(21,24,58,.04), 0 12px 28px -16px rgba(21,24,58,.14)', paper:'0 1px 0 rgba(0,0,0,.04), 0 30px 70px -24px rgba(21,24,58,.30)' },
    } },
  };
</script>
<style>
  :root { color-scheme: light dark; }
  body { -webkit-font-smoothing:antialiased; background:linear-gradient(180deg,#f6f7fa,#eef0f6); background-attachment:fixed; }
  .dark body { background:linear-gradient(180deg,#080b16,#05070f); }
  [x-cloak]{ display:none !important; }
  .num { font-feature-settings:'tnum' 1; font-variant-numeric:tabular-nums; }
  @keyframes rise { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  /* NOTE: tanpa fill-mode 'both' — kalau transform nyangkut, modal fixed di dalamnya jadi ke-clip (bukan full-screen). */
  .rise { animation:rise .35s cubic-bezier(.2,.7,.2,1); }
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}
  .lbl { display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8589a0;margin-bottom:6px }
  .dark .lbl{ color:#7c8198 }
  .fld,.fld-sm{ width:100%;border:1px solid #e6e8f0;border-radius:10px;background:#fff;color:#15183a;font-weight:500;transition:border-color .15s,box-shadow .15s }
  .fld{ padding:9px 12px;font-size:14px } .fld-sm{ padding:7px 10px;font-size:13px }
  .dark .fld,.dark .fld-sm{ background:#0e1226;border-color:rgba(255,255,255,.10);color:#e7e9f2 }
  .fld:focus,.fld-sm:focus{ outline:none;border-color:#14b8a6;box-shadow:0 0 0 3px rgba(20,184,166,.16) }
  .btn-primary{ background:linear-gradient(180deg,#27359d,#19237a);color:#fff }
  .btn-primary:hover{ background:linear-gradient(180deg,#212d88,#141d68) }
  .total-bar{ background:linear-gradient(160deg,#1d2150,#111430) }
  .dark .total-bar{ background:linear-gradient(160deg,#0d1126,#070a16) }
  .card{ background:#fff;border:1px solid #e6e8f0;border-radius:14px;box-shadow:0 1px 2px rgba(21,24,58,.04),0 12px 28px -16px rgba(21,24,58,.14) }
  .dark .card{ background:#0c1022;border-color:rgba(255,255,255,.07) }
  /* FORMULIR paper preview */
  .paper-doc{ background:#fff;color:#1a1c2e }
  .formulir{ font-family:'Newsreader',serif }
  .formulir table{ border-collapse:collapse;width:100% }
  .formulir th,.formulir td{ border:1px solid #d7dae8;padding:5px 8px }
  .formulir thead th{ background:#15183a;color:#fff;font-weight:600;font-size:10px;letter-spacing:.03em;font-family:'Satoshi',sans-serif;text-transform:uppercase }
</style>
</head>
<body class="font-sans text-ink dark:text-slate-200" x-data="{}" x-init="$store.router.sync()" x-cloak>

<!-- NAV -->
<nav class="sticky top-0 z-40 bg-paper/85 dark:bg-[#070a14]/85 backdrop-blur border-b border-line dark:border-white/[.07]">
  <div class="max-w-[1180px] mx-auto px-5 h-14 flex items-center gap-3">
    <a href="#/" class="flex items-center font-bold text-ink dark:text-white tracking-tight">
      <span class="text-[17px]">FINA<span class="text-accent-500 font-medium"> go</span></span>
    </a>
    <template x-if="$store.session.authed">
      <div class="flex items-center gap-1 ml-2 text-[13px] font-semibold">
        <a href="#/pengajuan" :class="['list','detail','form'].includes($store.router.view) ? 'text-brand-500 dark:text-white' : 'text-slate-400'" class="px-2.5 py-1.5 rounded-chip hover:bg-line/60 dark:hover:bg-white/5">Pengajuan</a>
        <template x-if="$store.session.has('verifikator') || $store.session.has('approver')">
          <a href="#/approvals" :class="$store.router.view==='approvals' ? 'text-brand-500 dark:text-white' : 'text-slate-400'" class="px-2.5 py-1.5 rounded-chip hover:bg-line/60 dark:hover:bg-white/5">Approval</a>
        </template>
      </div>
    </template>
    <div class="ml-auto flex items-center gap-2.5">
      <template x-if="$store.session.authed">
        <div class="flex items-center gap-2 pl-1 pr-3 py-1 rounded-full border border-line dark:border-white/10">
          <span class="w-6 h-6 rounded-full bg-brand-500 grid place-items-center text-[10px] font-bold text-white" x-text="$store.session.user.nama.split(' ').map(w=>w[0]).join('').slice(0,2)"></span>
          <span class="text-[13px] font-semibold" x-text="$store.session.user.nama"></span>
          <span class="text-[10px] uppercase tracking-wide text-accent-600 dark:text-accent-400 font-bold" x-text="$store.session.user.roles[0]"></span>
        </div>
      </template>
      <template x-if="$store.session.authed">
        <button @click="$store.session.logout()" class="p-2 rounded-fld text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-white/10" title="Keluar"><i data-lucide="log-out" class="w-[18px] h-[18px]"></i></button>
      </template>
      <button onclick="toggleDark()" class="p-2 rounded-fld text-slate-400 hover:text-ink hover:bg-line/60 dark:hover:bg-white/10 dark:hover:text-white"><i data-lucide="sun-moon" class="w-[18px] h-[18px]"></i></button>
    </div>
  </div>
</nav>

<main class="max-w-[1180px] mx-auto px-5 py-7">

  <!-- ============ LOGIN ============ -->
  <template x-if="$store.router.view==='login'">
    <section x-data="loginView()" class="rise max-w-[400px] mx-auto mt-12">
      <div class="text-center mb-7">
        <div class="mx-auto mb-5 w-fit dark:bg-white dark:rounded-2xl dark:px-5 dark:py-3"><img src="finago-logo.png" alt="FINA go — PT. Karta Bhumi Nusantara" class="h-14 sm:h-16" /></div>
        <h1 class="text-[20px] font-black tracking-tight text-ink dark:text-white">Masuk</h1>
      </div>
      <form @submit.prevent="submit()" class="card p-5 space-y-4">
        <label class="block"><span class="lbl">Email</span><input x-model="email" type="email" autocomplete="username" class="fld" placeholder="nama@kartabhumi.id" /></label>
        <label class="block"><span class="lbl">Password</span><input x-model="password" type="password" autocomplete="current-password" class="fld" placeholder="••••••••" /></label>
        <template x-if="err"><div class="text-[12px] text-rose-600 dark:text-rose-400 font-medium flex items-center gap-1.5"><i data-lucide="alert-circle" class="w-3.5 h-3.5"></i> <span x-text="err"></span></div></template>
        <button type="submit" :disabled="busy" class="btn-primary w-full py-3 rounded-fld text-[13px] font-bold disabled:opacity-60"><span x-text="busy?'Masuk…':'Masuk'"></span></button>
      </form>
      <div x-show="['localhost','127.0.0.1'].includes(location.hostname)" style="display:none" class="text-center text-[11px] text-slate-400 mt-4 space-y-1">
        <div class="font-semibold text-slate-500 dark:text-slate-400">Akun demo · password <span class="font-mono">fina123</span></div>
        <div><span class="font-mono text-slate-500 dark:text-slate-300">bagus@kartabhumi.id</span> — pengaju</div>
        <div><span class="font-mono text-slate-500 dark:text-slate-300">adinda@kartabhumi.id</span> — admin (semua role)</div>
        <div><span class="font-mono text-slate-500 dark:text-slate-300">wahyu@kartabhumi.id</span> — approver &amp; verifikator</div>
      </div>
    </section>
  </template>

  <!-- ============ HOME / MENU ============ -->
  <template x-if="$store.router.view==='home'">
    <section class="rise">
      <div class="mb-6">
        <div class="text-[11px] font-semibold uppercase tracking-[.14em] text-accent-600 dark:text-accent-400 mb-1.5">FINA go</div>
        <h1 class="text-[24px] font-black tracking-tight text-ink dark:text-white" x-text="'Hai, '+($store.session.user?.nama?.split(' ')[0]||'')+' 👋'"></h1>
        <p class="text-[13px] text-slate-500 mt-1">Mau ngapain hari ini?</p>
      </div>
      <div class="grid sm:grid-cols-2 gap-3 max-w-[640px]">
        <a href="#/buat" class="card p-5 active:scale-[.99] transition">
          <div class="w-11 h-11 rounded-[12px] bg-brand-500 grid place-items-center mb-3"><i data-lucide="file-plus" class="w-5 h-5 text-white"></i></div>
          <div class="font-bold text-[15px] text-ink dark:text-white">Buat pengajuan</div>
          <div class="text-[12px] text-slate-500 mt-0.5">Reimburse / purchase baru</div>
        </a>
        <a href="#/pengajuan" class="card p-5 active:scale-[.99] transition">
          <div class="w-11 h-11 rounded-[12px] bg-accent-500 grid place-items-center mb-3"><i data-lucide="list" class="w-5 h-5 text-white"></i></div>
          <div class="font-bold text-[15px] text-ink dark:text-white">Pengajuan</div>
          <div class="text-[12px] text-slate-500 mt-0.5">Lihat &amp; lacak status</div>
        </a>
        <template x-if="$store.session.has('verifikator')||$store.session.has('approver')">
          <a href="#/approvals" class="card p-5 active:scale-[.99] transition">
            <div class="w-11 h-11 rounded-[12px] bg-amber-500 grid place-items-center mb-3"><i data-lucide="inbox" class="w-5 h-5 text-white"></i></div>
            <div class="font-bold text-[15px] text-ink dark:text-white">Approval</div>
            <div class="text-[12px] text-slate-500 mt-0.5">Antrian yang nunggu kamu</div>
          </a>
        </template>
        <a href="#/rekening" class="card p-5 active:scale-[.99] transition">
          <div class="w-11 h-11 rounded-[12px] bg-slate-600 grid place-items-center mb-3"><i data-lucide="wallet" class="w-5 h-5 text-white"></i></div>
          <div class="font-bold text-[15px] text-ink dark:text-white">Rekening bank</div>
          <div class="text-[12px] text-slate-500 mt-0.5">Kelola rekening kamu</div>
        </a>
        <template x-if="$store.session.has('admin')||$store.session.has('verifikator')||$store.session.has('approver')">
          <a href="#/dashboard" class="card p-5 active:scale-[.99] transition">
            <div class="w-11 h-11 rounded-[12px] bg-emerald-600 grid place-items-center mb-3"><i data-lucide="bar-chart-3" class="w-5 h-5 text-white"></i></div>
            <div class="font-bold text-[15px] text-ink dark:text-white">Dashboard</div>
            <div class="text-[12px] text-slate-500 mt-0.5">Visualisasi &amp; filter data</div>
          </a>
        </template>
        <template x-if="$store.session.has('admin')||$store.session.has('verifikator')">
          <a href="#/monitored" class="card p-5 active:scale-[.99] transition">
            <div class="w-11 h-11 rounded-[12px] bg-rose-500 grid place-items-center mb-3"><i data-lucide="eye" class="w-5 h-5 text-white"></i></div>
            <div class="font-bold text-[15px] text-ink dark:text-white">Item dipantau</div>
            <div class="text-[12px] text-slate-500 mt-0.5">Yang ditandai dari pengajuan</div>
          </a>
        </template>
        <template x-if="$store.session.has('admin')||$store.session.has('approver')">
          <a href="#/users" class="card p-5 active:scale-[.99] transition">
            <div class="w-11 h-11 rounded-[12px] bg-violet-600 grid place-items-center mb-3"><i data-lucide="users" class="w-5 h-5 text-white"></i></div>
            <div class="font-bold text-[15px] text-ink dark:text-white">Pengguna</div>
            <div class="text-[12px] text-slate-500 mt-0.5">Kelola user &amp; role</div>
          </a>
        </template>
        <template x-if="$store.session.has('admin')">
          <a href="#/projects" class="card p-5 active:scale-[.99] transition">
            <div class="w-11 h-11 rounded-[12px] bg-indigo-500 grid place-items-center mb-3"><i data-lucide="folder-kanban" class="w-5 h-5 text-white"></i></div>
            <div class="font-bold text-[15px] text-ink dark:text-white">Proyek</div>
            <div class="text-[12px] text-slate-500 mt-0.5">Master kode unik</div>
          </a>
        </template>
      </div>
    </section>
  </template>

  <!-- ============ LIST ============ -->
  <template x-if="$store.router.view==='list'">
    <section x-data="pengajuanList()" x-init="init()" class="rise">
      <div class="flex items-center gap-3 mb-5">
        <div>
          <h1 class="text-[24px] font-black tracking-tight text-ink dark:text-white">Pengajuan</h1>
          <p class="text-[13px] text-slate-500">Reimburse &amp; purchase request</p>
        </div>
        <a href="#/buat" class="btn-primary ml-auto px-4 py-2.5 rounded-fld text-[13px] font-bold flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Buat pengajuan</a>
      </div>
      <div class="flex gap-2 mb-4">
        <select x-model="filter.state" @change="load()" class="fld-sm max-w-[180px]">
          <option value="">Semua status</option>
          <option value="draft">Draft</option><option value="submitted">Menunggu verif</option>
          <option value="verified">Terverifikasi</option><option value="approved">Disetujui</option>
          <option value="rejected">Ditolak</option><option value="paid">Cair</option>
        </select>
        <select x-model="filter.kategori" @change="load()" class="fld-sm max-w-[180px]">
          <option value="">Semua kategori</option>
          <option value="reimbursement">Reimbursement</option><option value="pengajuan_baru">Pengajuan Baru</option>
        </select>
        <div class="flex items-center gap-1.5">
          <input type="date" x-model="filter.from" class="fld-sm max-w-[150px]" title="Tanggal dari" />
          <span class="text-slate-400 text-[12px]">–</span>
          <input type="date" x-model="filter.to" class="fld-sm max-w-[150px]" title="Tanggal sampai" />
          <button x-show="filter.from||filter.to" @click="filter.from='';filter.to=''" class="text-[12px] text-slate-400 hover:text-rose-500 font-semibold px-1">reset</button>
        </div>
      </div>
      <div class="card overflow-hidden">
        <table class="w-full text-[13px]">
          <thead class="text-[10px] uppercase tracking-wide text-slate-400 border-b border-line dark:border-white/10">
            <tr><th class="text-left font-semibold px-4 py-3">NBR</th><th class="text-left font-semibold px-4 py-3">Tanggal</th><th class="text-left font-semibold px-4 py-3">Jenis Pengajuan</th><th class="text-left font-semibold px-4 py-3">Nama Pengaju</th><th class="text-left font-semibold px-4 py-3">Kode Unik</th><th class="text-right font-semibold px-4 py-3">Total</th><th class="text-left font-semibold px-4 py-3">Status</th><th class="px-2 py-3"></th></tr>
          </thead>
          <tbody>
            <template x-if="loading"><tr><td colspan="8" class="px-4 py-8 text-center text-slate-400">Memuat…</td></tr></template>
            <template x-if="!loading && shown.length===0"><tr><td colspan="8" class="px-4 py-10 text-center text-slate-400">Belum ada pengajuan.</td></tr></template>
            <template x-for="r in shown" :key="r.id">
              <tr @click="open(r.id)" class="border-b border-line/60 dark:border-white/[.05] hover:bg-line/40 dark:hover:bg-white/5 cursor-pointer">
                <td class="px-4 py-3 font-mono text-[12px] font-semibold text-brand-500 dark:text-accent-400" x-text="r.nbr"></td>
                <td class="px-4 py-3 text-slate-500 num text-[12px]" x-text="r.tanggal"></td>
                <td class="px-4 py-3 text-slate-600 dark:text-slate-300" x-text="r.kategori==='reimbursement'?'Reimbursement':'Pengajuan Baru'"></td>
                <td class="px-4 py-3 font-semibold text-ink dark:text-white" x-text="r.pengaju||'—'"></td>
                <td class="px-4 py-3 text-slate-500" x-text="r.kodeProyek"></td>
                <td class="px-4 py-3 text-right num font-semibold" x-text="rp(r.total)"></td>
                <td class="px-4 py-3"><span class="px-2 py-1 rounded-chip text-[11px] font-semibold" :class="stateCls(r.state)" x-text="stateLabel(r.state)"></span></td>
                <td class="px-2 py-3 text-right"><button x-show="canDelete(r)" @click.stop="askDelete(r)" class="p-1.5 rounded-md text-slate-300 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-500/10" title="Hapus pengajuan"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- konfirmasi hapus -->
      <div x-show="confirmRow" x-transition.opacity class="fixed inset-0 z-50 bg-ink/50 backdrop-blur-sm flex items-center justify-center p-4" style="display:none" @click.self="confirmRow=null" @keydown.escape.window="confirmRow=null">
        <div class="bg-white dark:bg-[#0c1022] rounded-card shadow-paper w-full max-w-[360px] p-5">
          <div class="flex items-center gap-2.5 mb-2"><span class="w-9 h-9 rounded-fld bg-rose-500/10 grid place-items-center text-rose-500 shrink-0"><i data-lucide="trash-2" class="w-4.5 h-4.5"></i></span><span class="text-[15px] font-bold text-ink dark:text-white">Hapus pengajuan?</span></div>
          <p class="text-[13px] text-slate-500 dark:text-slate-400 mb-4"><span class="font-mono font-semibold text-ink dark:text-white" x-text="confirmRow?.nbr"></span> bakal dihapus permanen. Nomor BR setelahnya otomatis dirapatkan.</p>
          <div class="flex gap-2">
            <button @click="confirmRow=null" class="flex-1 py-2.5 rounded-fld border border-line dark:border-white/15 text-slate-600 dark:text-slate-200 text-[13px] font-semibold">Batal</button>
            <button @click="doDelete()" class="flex-1 py-2.5 rounded-fld bg-rose-500 hover:bg-rose-600 text-white text-[13px] font-bold">Hapus</button>
          </div>
        </div>
      </div>
    </section>
  </template>

  <!-- ============ FORM ============ -->
  <template x-if="$store.router.view==='form'">
    <section x-data="pengajuanForm()" x-init="init()" class="rise max-w-[760px]">
      <div class="flex items-center gap-2 mb-5">
        <a href="#/pengajuan" class="p-2 rounded-fld text-slate-400 hover:bg-line/60 dark:hover:bg-white/5"><i data-lucide="arrow-left" class="w-4 h-4"></i></a>
        <h1 class="text-[22px] font-black tracking-tight text-ink dark:text-white" x-text="editId ? 'Edit draft' : 'Buat pengajuan'"></h1>
      </div>

      <div class="card p-5 mb-4">
        <div class="inline-flex p-1 rounded-fld border border-line dark:border-white/10 text-[13px] font-semibold mb-4">
          <button @click="kategori='reimbursement'" :class="kategori==='reimbursement' ? 'bg-ink text-white' : 'text-slate-500'" class="px-3.5 py-1.5 rounded-chip">Reimbursement</button>
          <button @click="kategori='pengajuan_baru'" :class="kategori==='pengajuan_baru' ? 'bg-ink text-white' : 'text-slate-500'" class="px-3.5 py-1.5 rounded-chip">Pengajuan Baru</button>
        </div>
        <label class="block mb-4"><span class="lbl">Nama pengajuan</span><input x-model="nama" class="fld" placeholder="cth. Operasional Project LiDAR Batch #3" /></label>
        <div class="grid sm:grid-cols-2 gap-4">
          <label class="block"><span class="lbl">Proyek</span><select x-model="kode" class="fld"><template x-for="p in projects" :key="p.kode"><option :value="p.kode" x-text="p.kode+' — '+p.deskripsi"></option></template></select></label>
          <label class="block"><span class="lbl">Tanggal</span><input type="date" x-model="tanggal" class="fld" /></label>
        </div>
      </div>

      <div class="card overflow-hidden mb-4">
        <div class="px-5 pt-5 pb-2 text-[14px] font-bold text-ink dark:text-white">Rincian anggaran</div>
        <div class="px-5 pb-2 space-y-2">
          <template x-for="(it,i) in items" :key="i">
            <div class="grid grid-cols-2 md:grid-cols-[1.4fr_.5fr_.6fr_.9fr_1fr_auto] gap-2 items-center">
              <input x-model="it.item" class="fld-sm col-span-2 md:col-span-1" placeholder="Item" />
              <input x-model.number="it.qty" type="number" min="0" class="fld-sm num" placeholder="Qty" />
              <input x-model="it.satuan" class="fld-sm" placeholder="Satuan" />
              <input :value="fmtNum(it.harga)" @input="it.harga=parseNum($event.target.value)" inputmode="numeric" class="fld-sm num" placeholder="Harga" />
              <input x-model="it.remark" class="fld-sm col-span-2 md:col-span-1" placeholder="Remark (opsional)" />
              <button @click="removeItem(i)" :disabled="items.length===1" class="justify-self-end p-1.5 rounded-md text-slate-300 hover:text-rose-500 disabled:opacity-30"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
          </template>
        </div>
        <div class="px-5 pb-4"><button @click="addItem()" class="w-full py-2.5 rounded-fld border border-dashed border-brand-200 dark:border-brand-400/30 text-brand-500 dark:text-accent-400 text-[13px] font-semibold hover:bg-brand-50 dark:hover:bg-brand-500/10 flex items-center justify-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Tambah baris</button></div>
        <div class="total-bar px-5 py-4 flex items-center justify-between border-t-2 border-accent-500"><span class="text-white/55 text-[11px] font-semibold uppercase tracking-[.1em]">Total</span><span class="text-white text-[24px] font-black num" x-text="rp(total)"></span></div>
      </div>

      <div class="card p-5 mb-4 space-y-4">
        <div class="block">
          <span class="lbl">Dana dicairkan ke rekening</span>
          <div class="space-y-2">
            <template x-for="(e,i) in rekeningEntries" :key="i">
              <div class="rounded-fld border border-line dark:border-white/10 p-2.5 space-y-2">
                <div class="flex gap-2 items-center">
                  <select x-model="e.sel" class="fld-sm flex-1">
                    <option value="">— pilih rekening —</option>
                    <template x-for="r in rekenings" :key="r.id"><option :value="r.id" x-text="r.number+' '+r.bankName+' a.n '+r.holderName"></option></template>
                    <option value="__other__">+ Rekening lainnya (isi manual)</option>
                  </select>
                  <button type="button" @click="removeRekening(i)" x-show="rekeningEntries.length>1" class="p-1.5 rounded-md text-slate-300 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>
                <div x-show="e.sel==='__other__'" class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <input x-model="e.bankName" class="fld-sm" placeholder="Bank (cth. BCA)" />
                  <input x-model="e.number" inputmode="numeric" class="fld-sm" placeholder="No. rekening" />
                  <input x-model="e.holderName" class="fld-sm" placeholder="Atas nama" />
                </div>
              </div>
            </template>
          </div>
          <button type="button" @click="addRekening()" class="mt-2 text-[12px] font-semibold text-brand-500 dark:text-accent-400 inline-flex items-center gap-1"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah rekening</button>
        </div>
        <div class="block">
          <span class="lbl">Lampiran nota / bukti (foto)</span>
          <input type="file" multiple accept="image/*" @change="onNotaChange($event)" x-ref="notaInput" class="hidden" />
          <button type="button" @click="$refs.notaInput.click()" :disabled="notaCount>=10" class="w-full py-2.5 rounded-fld border border-dashed border-brand-300 dark:border-brand-400/40 text-brand-500 dark:text-accent-400 text-[13px] font-semibold hover:bg-brand-50 dark:hover:bg-brand-500/10 flex items-center justify-center gap-2 disabled:opacity-40"><i data-lucide="paperclip" class="w-4 h-4"></i> Lampirkan bukti <span class="text-slate-400 font-normal" x-text="'('+notaCount+'/10)'"></span></button>
          <div x-show="existingNotaKeys.length" class="text-[11px] text-slate-400 mt-2" x-text="existingNotaKeys.length+' lampiran tersimpan sebelumnya'"></div>
          <div x-show="notaPreviews.length" class="grid grid-cols-4 gap-2 mt-3">
            <template x-for="(n,i) in notaPreviews" :key="i">
              <div class="relative group rounded-fld overflow-hidden border border-line dark:border-white/10 aspect-square">
                <img :src="n.url" class="w-full h-full object-cover" />
                <button type="button" @click="removeNota(i)" class="absolute top-1 right-1 w-5 h-5 rounded-full bg-ink/70 text-white grid place-items-center opacity-0 group-hover:opacity-100 transition"><i data-lucide="x" class="w-3 h-3"></i></button>
              </div>
            </template>
          </div>
          <span class="text-[11px] text-accent-600 dark:text-accent-400 font-medium mt-2 inline-flex items-center gap-1" x-show="notaCount"><i data-lucide="image" class="w-3 h-3"></i> <span x-text="notaCount + ' bukti (maks 10) — ikut ke-embed di .docx'"></span></span>
        </div>
      </div>

      <button @click="showPreview=true" type="button" class="w-full mb-3 py-2.5 rounded-fld border border-line dark:border-white/15 text-slate-600 dark:text-slate-200 text-[13px] font-semibold flex items-center justify-center gap-2 hover:bg-line/40 dark:hover:bg-white/5"><i data-lucide="eye" class="w-4 h-4"></i> Lihat preview dokumen</button>
      <div class="flex gap-2.5">
        <button @click="save(true)" :disabled="saving" class="btn-primary flex-1 py-3 rounded-fld text-[13px] font-bold flex items-center justify-center gap-2 disabled:opacity-60"><i data-lucide="send" class="w-4 h-4"></i> Simpan &amp; Submit</button>
        <button @click="save(false)" :disabled="saving" class="py-3 px-4 rounded-fld border border-line dark:border-white/15 text-slate-600 dark:text-slate-200 font-bold text-[13px] disabled:opacity-60">Simpan draft</button>
      </div>

      <!-- preview modal -->
      <div x-show="showPreview" x-transition.opacity class="fixed inset-0 z-50 bg-ink/50 backdrop-blur-sm flex items-start sm:items-center justify-center p-3 sm:p-6 overflow-y-auto" style="display:none" @click.self="showPreview=false" @keydown.escape.window="showPreview=false">
        <div class="bg-white dark:bg-[#0c1022] rounded-card shadow-paper w-full max-w-[520px] my-auto">
          <div class="flex items-center justify-between px-4 py-3 border-b border-line dark:border-white/10">
            <span class="text-[13px] font-bold text-ink dark:text-white">Preview FORMULIR</span>
            <button @click="showPreview=false" class="p-1.5 rounded-fld text-slate-400 hover:bg-line/60 dark:hover:bg-white/5"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <div class="p-4 sm:p-5 max-h-[78vh] overflow-y-auto">
            <div class="paper-doc formulir rounded-[3px] border border-line shadow-soft p-5 sm:p-7 text-[12px]">
              <div class="flex items-start justify-between border-b-2 border-ink pb-2.5 mb-4">
                <div><div class="font-sans font-black text-ink text-[16px] leading-none">FINA<span class="text-accent-600 font-medium"> go</span></div><div class="text-[9px] text-slate-400 font-sans mt-1 tracking-wide">PT. KARTA BHUMI NUSANTARA</div></div>
                <div class="text-right"><div class="text-[8px] uppercase tracking-[.12em] text-slate-400 font-sans">No. Dokumen</div><div class="font-mono text-[10px] font-semibold text-ink mt-0.5" x-text="'BR•••'+(tanggal||'').slice(0,4)+'/'+kode+'/'+katLabel.replace(' ','-')"></div></div>
              </div>
              <div class="text-center font-sans font-semibold tracking-[.16em] text-[12px] uppercase mb-1 text-ink" x-text="'FORMULIR '+katLabel.toUpperCase()"></div>
              <div class="text-center text-[12px] italic mb-4" :class="nama.trim()?'text-slate-500':'text-slate-300'" x-text="nama.trim()||'judul pengajuan…'"></div>
              <table class="mb-3">
                <thead><tr><th class="w-6">No</th><th class="text-left">Rincian Anggaran</th><th class="w-8">Qty</th><th class="w-8">Sat.</th><th class="w-16 text-right">Jumlah</th><th class="text-left">Remark</th></tr></thead>
                <tbody>
                  <template x-for="(it,i) in items" :key="i"><tr><td class="text-center" x-text="i+1"></td><td :class="{'text-slate-300 italic':!it.item.trim()}" x-text="it.item.trim()||'item…'"></td><td class="text-center" x-text="it.qty||0"></td><td class="text-center" x-text="it.satuan||'-'"></td><td class="text-right" x-text="fmt((Number(it.qty)||0)*(Number(it.harga)||0))"></td><td class="text-slate-500" x-text="it.remark||''"></td></tr></template>
                  <tr class="font-bold"><td colspan="4" class="text-right uppercase text-[10px] font-sans" style="background:#14b8a610">Total</td><td class="text-right" style="background:#14b8a610" x-text="'Rp'+fmt(total)"></td><td style="background:#14b8a610"></td></tr>
                </tbody>
              </table>
              <div class="text-[11px] mb-6"><span class="text-slate-500">*Dikirim ke Rekening:</span>
                <template x-if="rekeningLines.length<=1"><span class="font-semibold" x-text="' '+(rekeningLines[0]||'—')"></span></template>
                <template x-if="rekeningLines.length>1"><span><template x-for="(r,idx) in rekeningLines" :key="idx"><span class="block font-semibold" x-text="(idx+1)+'. '+r"></span></template></span></template>
              </div>
              <div class="grid grid-cols-3 gap-2 text-center text-[10px]">
                <div><div class="text-slate-500 mb-8">Prepared &amp; Requested by</div><div class="border-t border-slate-400 pt-1 font-semibold" x-text="$store.session.user?.nama||''"></div></div>
                <div><div class="text-slate-500 mb-8">Reviewed by</div><div class="border-t border-slate-400 pt-1 font-semibold text-slate-400">—</div></div>
                <div><div class="text-slate-500 mb-8">Approved by</div><div class="border-t border-slate-400 pt-1 font-semibold text-slate-400">—</div></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </template>

  <!-- ============ DETAIL ============ -->
  <template x-if="$store.router.view==='detail'">
    <section x-data="pengajuanDetail()" x-init="init()" class="rise max-w-[760px]">
      <div class="flex items-center gap-2 mb-5">
        <a href="#/pengajuan" class="p-2 rounded-fld text-slate-400 hover:bg-line/60 dark:hover:bg-white/5"><i data-lucide="arrow-left" class="w-4 h-4"></i></a>
        <h1 class="text-[22px] font-black tracking-tight text-ink dark:text-white">Detail pengajuan</h1>
      </div>
      <template x-if="loading"><div class="text-slate-400 py-10 text-center">Memuat…</div></template>
      <template x-if="!loading && p">
        <div>
          <div class="card p-5 mb-4">
            <div class="flex items-start justify-between mb-4">
              <div>
                <div class="font-mono text-[12px] font-semibold text-brand-500 dark:text-accent-400" x-text="p.nbr"></div>
                <div class="text-[18px] font-black text-ink dark:text-white" x-text="p.nama"></div>
              </div>
              <span class="px-2.5 py-1 rounded-chip text-[12px] font-semibold" :class="stateCls(p.state)" x-text="stateLabel(p.state)"></span>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-[13px]">
              <div><span class="lbl">Proyek</span><span x-text="p.kodeProyek"></span></div>
              <div><span class="lbl">Kategori</span><span x-text="p.kategori==='reimbursement'?'Reimbursement':'Pengajuan Baru'"></span></div>
              <div><span class="lbl">Tanggal</span><span x-text="p.tanggal"></span></div>
            </div>
            <template x-if="p.notaUrl"><div class="mt-3 pt-3 border-t border-line dark:border-white/10 text-[12px] text-slate-500 flex items-center gap-1.5"><i data-lucide="paperclip" class="w-3.5 h-3.5"></i> Ada lampiran bukti — ikut di .docx</div></template>
          </div>

          <!-- lampiran / bukti (tampil) -->
          <template x-if="notaUrls.length">
            <div class="card p-5 mb-4">
              <div class="flex items-center gap-2 text-[13px] font-bold text-ink dark:text-white mb-3"><i data-lucide="image" class="w-4 h-4 text-slate-400"></i> Lampiran / Bukti</div>
              <div class="grid grid-cols-3 sm:grid-cols-4 gap-2">
                <template x-for="n in notaUrls" :key="n.key">
                  <template x-if="!n.failed">
                    <a :href="n.url" target="_blank" rel="noopener" class="block rounded-fld overflow-hidden border border-line dark:border-white/10 aspect-square hover:opacity-90 transition"><img :src="n.url" @error="n.failed=true" class="w-full h-full object-cover" /></a>
                  </template>
                  <template x-if="n.failed">
                    <button type="button" @click="retryNota(n)" class="rounded-fld border border-dashed border-line dark:border-white/15 aspect-square grid place-items-center text-center text-slate-400 hover:text-brand-500 hover:border-brand-300 gap-1"><i data-lucide="refresh-cw" class="w-4 h-4"></i><span class="text-[10px] font-semibold px-1">Gagal muat<br/>Muat ulang</span></button>
                  </template>
                </template>
              </div>
            </div>
          </template>

          <div class="card overflow-hidden mb-4">
            <table class="w-full text-[13px]">
              <thead class="text-[10px] uppercase tracking-wide text-slate-400 border-b border-line dark:border-white/10"><tr><th class="text-left font-semibold px-4 py-2.5">Item</th><th class="text-center font-semibold px-4 py-2.5">Qty</th><th class="text-left font-semibold px-4 py-2.5">Sat.</th><th class="text-right font-semibold px-4 py-2.5">Subtotal</th><th class="text-left font-semibold px-4 py-2.5">Remark</th></tr></thead>
              <tbody>
                <template x-for="it in p.items" :key="it.id">
                  <tr class="border-b border-line/60 dark:border-white/[.05] align-top">
                    <td class="px-4 py-2.5 font-medium">
                      <div class="flex items-center gap-1.5">
                        <span x-text="it.item"></span>
                        <template x-if="canTag">
                          <button @click="toggleMonitor(it)" class="shrink-0 inline-grid place-items-center w-5 h-5 rounded-md transition" :class="it.monitored ? 'text-accent-600 dark:text-accent-400 bg-accent-500/10' : 'text-slate-300 hover:text-slate-500 hover:bg-line/60 dark:hover:bg-white/5'" :title="it.monitored ? 'Dipantau — klik buat lepas' : 'Tandai dipantau'"><i :data-lucide="it.monitored ? 'eye' : 'eye-off'" class="w-3.5 h-3.5"></i></button>
                        </template>
                        <template x-if="!canTag && it.monitored">
                          <i data-lucide="eye" class="w-3.5 h-3.5 text-accent-500" title="Dipantau"></i>
                        </template>
                      </div>
                    </td>
                    <td class="px-4 py-2.5 text-center num" x-text="it.qty"></td>
                    <td class="px-4 py-2.5 text-slate-500" x-text="it.satuan||'-'"></td>
                    <td class="px-4 py-2.5 text-right num" x-text="rp(it.subtotal)"></td>
                    <td class="px-4 py-2.5 text-slate-500" x-text="it.remark||'—'"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div class="total-bar px-4 py-3.5 flex items-center justify-between border-t-2 border-accent-500"><span class="text-white/55 text-[11px] font-semibold uppercase tracking-[.1em]">Total</span><span class="text-white text-[20px] font-black num" x-text="rp(p.total)"></span></div>
          </div>

          <!-- tujuan pencairan -->
          <template x-if="p.rekeningList && p.rekeningList.length">
            <div class="card p-5 mb-4">
              <div class="flex items-center gap-2 text-[13px] font-bold text-ink dark:text-white mb-2"><i data-lucide="banknote" class="w-4 h-4 text-slate-400"></i> Dana dicairkan ke</div>
              <ul class="text-[13px] space-y-1">
                <template x-for="(r,i) in p.rekeningList" :key="i"><li class="flex gap-2"><span class="text-slate-400 num" x-text="(i+1)+'.'"></span><span><span class="font-semibold num" x-text="r.number"></span> · <span x-text="r.bankName"></span> a.n <span x-text="r.holderName"></span></span></li></template>
              </ul>
            </div>
          </template>

          <!-- justifikasi (kalau kena flag anomali) -->
          <template x-if="canJustify">
            <div class="card p-5 mb-4 border-rose-200 dark:border-rose-500/30">
              <div class="flex items-center gap-2 text-rose-600 dark:text-rose-400 font-bold text-[14px] mb-2"><i data-lucide="alert-triangle" class="w-4 h-4"></i> Perlu justifikasi</div>
              <p class="text-[13px] text-slate-600 dark:text-slate-300 mb-2">Pengajuan ini ke-flag mirip pengajuan sebelumnya. Tulis alasan biar verifikator bisa lanjut.</p>
              <template x-if="anomaly && anomaly.reasons && anomaly.reasons.length">
                <ul class="text-[12px] text-rose-600 dark:text-rose-400 list-disc pl-5 mb-3 space-y-0.5"><template x-for="r in anomaly.reasons" :key="r"><li x-text="r"></li></template></ul>
              </template>
              <textarea x-model="justifyText" rows="2" class="fld mb-3" placeholder="cth. Servis ini beda unit / kondisi darurat…"></textarea>
              <button @click="justify()" :disabled="busy" class="btn-primary w-full py-2.5 rounded-fld text-[13px] font-bold disabled:opacity-60">Kirim justifikasi</button>
            </div>
          </template>

          <!-- aksi -->
          <div class="card p-5">
            <div class="flex flex-wrap gap-2">
              <template x-if="canEdit"><button @click="edit()" class="px-4 py-2.5 rounded-fld border border-line dark:border-white/15 font-bold text-[13px] flex items-center gap-2"><i data-lucide="pencil" class="w-4 h-4"></i> Edit</button></template>
              <template x-if="canRevise"><button @click="edit()" class="btn-primary px-4 py-2.5 rounded-fld font-bold text-[13px] flex items-center gap-2"><i data-lucide="pencil" class="w-4 h-4"></i> Revisi</button></template>
              <template x-if="canTag"><button @click="openMonitoredList()" class="px-4 py-2.5 rounded-fld border border-line dark:border-white/15 font-bold text-[13px] flex items-center gap-2"><i data-lucide="eye" class="w-4 h-4"></i> Item dipantau</button></template>
              <template x-if="canVerify"><button @click="act('/verify')" :disabled="busy" class="btn-primary px-4 py-2.5 rounded-fld font-bold text-[13px] flex items-center gap-2 disabled:opacity-60"><i data-lucide="check" class="w-4 h-4"></i> Verifikasi</button></template>
              <template x-if="canApprove"><button @click="act('/approve')" :disabled="busy" class="btn-primary px-4 py-2.5 rounded-fld font-bold text-[13px] flex items-center gap-2 disabled:opacity-60"><i data-lucide="check-check" class="w-4 h-4"></i> Setujui</button></template>
              <template x-if="canPay"><button @click="act('/pay')" :disabled="busy" class="px-4 py-2.5 rounded-fld bg-emerald-600 text-white font-bold text-[13px] flex items-center gap-2 disabled:opacity-60"><i data-lucide="banknote" class="w-4 h-4"></i> Tandai cair</button></template>
              <template x-if="canReturn"><button @click="askReason('/return','Kembalikan ke pengaju','Kembalikan')" :disabled="busy" class="px-4 py-2.5 rounded-fld border border-line dark:border-white/15 font-bold text-[13px] flex items-center gap-2 disabled:opacity-60"><i data-lucide="corner-up-left" class="w-4 h-4"></i> Kembalikan</button></template>
              <template x-if="canReject"><button @click="askReason('/reject','Tolak pengajuan','Tolak', true)" :disabled="busy" class="px-4 py-2.5 rounded-fld border border-rose-200 dark:border-rose-500/30 text-rose-600 dark:text-rose-400 font-bold text-[13px] flex items-center gap-2 disabled:opacity-60"><i data-lucide="x" class="w-4 h-4"></i> Tolak</button></template>
              <template x-if="canReopen"><button @click="act('/reopen')" :disabled="busy" class="px-4 py-2.5 rounded-fld border border-amber-300 dark:border-amber-500/40 text-amber-700 dark:text-amber-400 font-bold text-[13px] flex items-center gap-2 disabled:opacity-60" title="Buka lagi biar keputusan bisa direvisi"><i data-lucide="rotate-ccw" class="w-4 h-4"></i> Buka kembali</button></template>
              <template x-if="hasDoc"><button @click="download()" class="ml-auto px-4 py-2.5 rounded-fld border border-line dark:border-white/15 font-bold text-[13px] flex items-center gap-2"><i data-lucide="file-down" class="w-4 h-4"></i> Download .docx</button></template>
            </div>
          </div>

          <!-- modal alasan: tolak / kembalikan -->
          <div x-show="reason.open" x-transition.opacity class="fixed inset-0 z-50 bg-ink/50 backdrop-blur-sm flex items-start sm:items-center justify-center p-3 sm:p-6 overflow-y-auto" style="display:none" @click.self="reason.open=false" @keydown.escape.window="reason.open=false">
            <div class="bg-white dark:bg-[#0c1022] rounded-card shadow-paper w-full max-w-[420px] my-auto p-5">
              <div class="flex items-center justify-between mb-4"><span class="text-[15px] font-bold text-ink dark:text-white" x-text="reason.title"></span><button @click="reason.open=false" class="p-1.5 rounded-fld text-slate-400 hover:bg-line/60 dark:hover:bg-white/5"><i data-lucide="x" class="w-4 h-4"></i></button></div>
              <textarea x-model="reason.text" rows="3" class="fld mb-4" placeholder="Tulis alasan (wajib)…" @keydown.escape.stop="reason.open=false"></textarea>
              <div class="flex gap-2">
                <button @click="submitReason()" :disabled="busy" class="flex-1 py-2.5 rounded-fld text-white font-bold text-[13px] disabled:opacity-60" :class="reason.danger ? 'bg-rose-500 hover:bg-rose-600' : 'btn-primary'" x-text="reason.confirmLabel"></button>
                <button @click="reason.open=false" class="py-2.5 px-4 rounded-fld border border-line dark:border-white/15 text-slate-600 dark:text-slate-200 font-bold text-[13px]">Batal</button>
              </div>
            </div>
          </div>

          <!-- daftar item dipantau (lintas pengajuan) -->
          <div x-show="monitoredListOpen" x-transition.opacity class="fixed inset-0 z-50 bg-ink/50 backdrop-blur-sm flex items-start sm:items-center justify-center p-3 sm:p-6 overflow-y-auto" style="display:none" @click.self="monitoredListOpen=false" @keydown.escape.window="monitoredListOpen=false">
            <div class="bg-white dark:bg-[#0c1022] rounded-card shadow-paper w-full max-w-[460px] my-auto p-5">
              <div class="flex items-center justify-between mb-3"><span class="text-[15px] font-bold text-ink dark:text-white flex items-center gap-2"><i data-lucide="eye" class="w-4 h-4 text-accent-600 dark:text-accent-400"></i> Item dipantau</span><button @click="monitoredListOpen=false" class="p-1.5 rounded-fld text-slate-400 hover:bg-line/60 dark:hover:bg-white/5"><i data-lucide="x" class="w-4 h-4"></i></button></div>

              <template x-for="(r,i) in (stats ? stats.items : [])" :key="i">
                <tr class="border-b border-line/60 dark:border-white/[.05]">
                  <td class="px-5 py-2.5"><div class="font-medium text-ink dark:text-white" x-text="r.item"></div><div class="text-[11px] text-slate-400 truncate max-w-[220px]" x-text="r.namaPengajuan + ' · ' + r.pengaju"></div></td>
                  <td class="px-3 py-2.5 text-right num text-slate-500"><span x-text="r.qty"></span> <span class="text-slate-400" x-text="r.satuan||''"></span></td>
                  <td class="px-3 py-2.5 text-right num font-semibold" x-text="rp(r.subtotal)"></td>
                  <td class="px-3 py-2.5 font-mono text-[11px] text-brand-500 dark:text-accent-400" x-text="r.nbr"></td>
                  <td class="px-5 py-2.5"><span class="px-2 py-0.5 rounded-chip text-[10px] font-semibold" :class="stateCls(r.state)" x-text="stateLabel(r.state)"></span></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
      <template x-if="loading"><div class="text-slate-400 py-6 text-center text-[13px]">Memuat…</div></template>
    </section>
  </template>

  <!-- ============ PROJECTS ============ -->
  <template x-if="$store.router.view==='projects'">
    <section x-data="projectsView()" x-init="init()" class="rise max-w-[680px]">
      <div class="flex items-center gap-3 mb-5">
        <a href="#/" class="p-2 rounded-fld text-slate-400 hover:bg-line/60 dark:hover:bg-white/5"><i data-lucide="arrow-left" class="w-4 h-4"></i></a>
        <div><h1 class="text-[22px] font-black tracking-tight text-ink dark:text-white">Proyek</h1><p class="text-[13px] text-slate-500">Master kode unik (REKAP COP)</p></div>
        <template x-if="canManage"><button @click="showAdd=true" class="btn-primary ml-auto px-3.5 py-2.5 rounded-fld text-[13px] font-bold flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Tambah</button></template>
      </div>
      <template x-if="loading"><div class="text-slate-400 py-8 text-center text-[13px]">Memuat…</div></template>
      <div class="space-y-2.5">
        <template x-for="r in rows" :key="r.kode">
          <div class="card p-4 flex items-center gap-3">
            <span class="font-mono text-[12px] font-bold text-brand-500 dark:text-accent-400 shrink-0 w-16" x-text="r.kode"></span>
            <div class="flex-1 min-w-0 text-[13px] font-medium text-ink dark:text-white truncate" x-text="r.deskripsi"></div>
            <template x-if="!r.active"><span class="text-[10px] uppercase font-bold text-slate-400 shrink-0">nonaktif</span></template>
          </div>
        </template>
      </div>
      <div x-show="showAdd" x-transition.opacity class="fixed inset-0 z-50 bg-ink/50 backdrop-blur-sm flex items-start sm:items-center justify-center p-3 sm:p-6 overflow-y-auto" style="display:none" @click.self="showAdd=false" @keydown.escape.window="showAdd=false">
        <div class="bg-white dark:bg-[#0c1022] rounded-card shadow-paper w-full max-w-[420px] my-auto p-5">
          <div class="flex items-center justify-between mb-4"><span class="text-[15px] font-bold text-ink dark:text-white">Tambah proyek</span><button @click="showAdd=false" class="p-1.5 rounded-fld text-slate-400 hover:bg-line/60 dark:hover:bg-white/5"><i data-lucide="x" class="w-4 h-4"></i></button></div>
          <div class="space-y-3">
            <label class="block"><span class="lbl">Kode unik</span><input x-model="f.kode" class="fld" placeholder="PRO013" /></label>
            <label class="block"><span class="lbl">Deskripsi proyek</span><input x-model="f.deskripsi" class="fld" placeholder="Nama / deskripsi proyek" /></label>
          </div>
          <button @click="add()" :disabled="saving" class="btn-primary w-full mt-4 py-2.5 rounded-fld text-[13px] font-bold disabled:opacity-60">Simpan</button>
        </div>
      </div>
    </section>
  </template>

</main>

<!-- toast -->
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden">
  <div id="toast-box" class="text-white text-[13px] font-semibold px-4 py-2.5 rounded-fld shadow-paper flex items-center gap-2 bg-ink"><i id="toast-icon" data-lucide="check-circle-2" class="w-4 h-4 text-accent-400"></i><span id="toast-msg"></span></div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script type="module" src="main.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>window.addEventListener('load',()=>window.lucide?.createIcons());document.addEventListener('alpine:initialized',()=>setTimeout(()=>window.lucide?.createIcons(),50));</script>
</body>
</html>
